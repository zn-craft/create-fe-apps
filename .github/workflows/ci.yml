# 仓库自身的检查。模板验证单独一个 job，因为它会真实建项目并安装依赖。
name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 engines 声明的下限和当前版本
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run audit:deps
      - run: pnpm run build

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 按几种组合生成项目、装依赖，并跑模板自带的 lint / typecheck / format / build
      - run: pnpm run verify:templates
